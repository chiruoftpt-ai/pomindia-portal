[project]
name = "pomindia-portal"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Chiru", email = "chiruoftpt@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
pomindia-portal = "pomindia_portal:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pomindia_portal --cov-report=term-missing --cov-fail-under=80"
